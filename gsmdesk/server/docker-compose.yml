# Servidor GSMDesk: ID (hbbs) + relé (hbbr), basado en rustdesk-server (AGPL-3.0).
#
# Puertos que hay que abrir en el firewall del VPS:
#   TCP 21115-21119   UDP 21116
#
# Uso:
#   docker compose up -d
#   cat data/id_ed25519.pub     <- esta es la clave (GSMDESK_KEY)

services:
  hbbs:
    container_name: gsmdesk-hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: gsmdesk-hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
