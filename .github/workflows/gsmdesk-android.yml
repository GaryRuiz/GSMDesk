# Builds GSMDesk for Android. Based on the Android job of flutter-build.yml.
#
# Server settings are baked in at build time, same repository variables as
# gsmdesk-windows.yml (GSMDESK_SERVER, GSMDESK_KEY, GSMDESK_RELAY, GSMDESK_API).
#
# Signing uses these repository secrets, so updates install over older versions:
#   ANDROID_SIGNING_KEY        release keystore (PKCS#12), base64
#   ANDROID_ALIAS              key alias
#   ANDROID_KEY_STORE_PASSWORD keystore password (also the key password)
# Without them the APK gets a throwaway debug signature (for tests only: every
# build differs, so it cannot update a previous install).
#
# Outputs (as run artifacts, and as a GitHub release when a v* tag is pushed):
#   GSMDesk-<version>-arm64.apk   nearly every current phone
#   GSMDesk-<version>-armv7.apk   older 32-bit phones

name: GSMDesk Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  GSMDESK_SERVER: ${{ vars.GSMDESK_SERVER }}
  GSMDESK_KEY: ${{ vars.GSMDESK_KEY }}
  GSMDESK_RELAY: ${{ vars.GSMDESK_RELAY }}
  GSMDESK_API: ${{ vars.GSMDESK_API }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    name: build (${{ matrix.job.arch }})
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64, target: aarch64-linux-android, abi: arm64-v8a, ndk-lib: aarch64-linux-android, ndk-script: ndk_arm64.sh, flutter-platform: android-arm64 }
          - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a, ndk-lib: arm-linux-androideabi, ndk-script: ndk_arm.sh, flutter-platform: android-arm }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpam0g-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Warn when no server is configured
        if: env.GSMDESK_SERVER == '' || env.GSMDESK_KEY == ''
        run: echo "::warning::GSMDESK_SERVER/GSMDESK_KEY are not set; this build uses RustDesk's public servers (development only)."

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{ env.ANDROID_FLUTTER_VERSION }} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # Fails in a few minutes instead of at the end of the build.
      - name: Check the Dart code of the phone screens
        if: matrix.job.arch == 'arm64'
        working-directory: flutter
        run: |
          flutter pub get
          dart analyze --no-fatal-warnings lib/mobile lib/common/gsmdesk_update.dart lib/common/gsmdesk_license.dart lib/common/widgets/peer_card.dart lib/common.dart lib/desktop/pages/desktop_home_page.dart lib/desktop/pages/connection_page.dart lib/desktop/widgets/remote_toolbar.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: gsmdesk-android
          key: ${{ matrix.job.target }}

      - name: Build GSMDesk library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk-script }}

      - name: Set up signing
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY" ]; then
            echo "$ANDROID_SIGNING_KEY" | base64 -d > ./flutter/android/app/gsmdesk-release.p12
            {
              echo "storeFile=gsmdesk-release.p12"
              echo "keyAlias=$ANDROID_ALIAS"
              echo "storePassword=$ANDROID_KEY_STORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_STORE_PASSWORD"
            } > ./flutter/android/key.properties
          else
            echo "::warning::No ANDROID_SIGNING_KEY: this APK has a throwaway debug signature (tests only)."
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          libs=./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          mkdir -p "$libs"
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.ndk-lib }}/libc++_shared.so "$libs/"
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so "$libs/librustdesk.so"
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.flutter-platform }} --split-per-abi
          popd
          mkdir -p dist
          mv flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk "dist/GSMDesk-${VERSION}-${{ matrix.job.arch }}.apk"

      - name: Show the APK signature
        continue-on-error: true
        run: |
          apksigner=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ | tail -n 1)apksigner
          "$apksigner" verify --verbose --print-certs dist/*.apk

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gsmdesk-android-${{ matrix.job.arch }}
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: ./dist/*
